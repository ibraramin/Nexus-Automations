<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0e1218" fill-opacity="0.06" />
    </pattern>
    <radialGradient id="glowTeal" cx="6%" cy="2%" r="58%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSky" cx="96%" cy="98%" r="52%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- light / teal theme tokens from app/globals.css (:root) -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="630" fill="url(#glowTeal)" />
  <rect width="1200" height="630" fill="url(#glowSky)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- brand row: teal share/network glyph on a light tile -->
  <g>
    <rect x="72" y="58" width="48" height="48" rx="14" fill="#f1f5f9" stroke="#0e1218" stroke-opacity="0.12" stroke-width="1.5" />
    <g fill="#0e7490">
      <circle cx="88" cy="76" r="5" />
      <circle cx="112" cy="74" r="5" />
      <circle cx="98" cy="94" r="5" />
    </g>
    <g stroke="#0e7490" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 92 77 L 108 75" />
      <path d="M 91 80 L 96 90" />
      <path d="M 110 78 L 102 91" />
    </g>
    <text x="138" y="90" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#0e1218">Nexus Automations</text>
  </g>

  <!-- current live H1 copy -->
  <text x="72" y="208" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0e1218">Automation for small businesses,</text>
  <text x="72" y="270" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0e1218">built around your workflow,</text>
  <text x="72" y="332" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0e7490">delivered in your timezone.</text>

  <text x="72" y="392" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="25" fill="#64748b">Custom WhatsApp, AI and workflow automations.</text>

  <!-- teal CTA with arrow -->
  <rect x="72" y="440" width="350" height="58" rx="29" fill="#0e7490" />
  <text x="247" y="477" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Free automation audit &#8594;</text>

  <!-- footer tag: end-anchored so it can never clip at the right edge -->
  <line x1="72" y1="546" x2="1128" y2="546" stroke="#0e1218" stroke-opacity="0.08" stroke-width="1.5" />
  <circle cx="838" cy="589" r="6" fill="#0e7490" />
  <text x="1128" y="595" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">WhatsApp + AI automation</text>
</svg>
